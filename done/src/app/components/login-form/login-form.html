<form class="flex w-full flex-col items-center gap-8 select-none">
  <h1 class="text-5xl font-bold">Login</h1>
  <div class="flex w-full flex-col gap-4">
    <app-input label="Username" />
    <app-input label="Password" [type]="'password'" />
  </div>
  <app-checkbox label="Remember me" />
  <app-button label="Login" btnType="primary" />
</form>
