<p-popover #op styleClass="options-popover">
  <div class="flex min-w-32 flex-col gap-1">
    @for (item of items(); track item.label) {
      <app-button
        [icon]="item.data.icon"
        [label]="item.label"
        variant="text"
        size="small"
        [fluid]="true"
        styleClass="justify-start!"
      />
    }
  </div>
</p-popover>

<app-button
  size="small"
  icon="remixMore2Line"
  variant="text"
  (click)="op.toggle($event)"
  [rounded]="true"
/>
