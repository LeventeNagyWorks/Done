<div
  [class]="
    'relative flex h-full flex-col gap-6 rounded-2xl bg-black/80 p-6 transition-transform duration-500 select-none ' +
    (isCollapsed() ? 'w-fit' : 'w-full max-w-xl')
  "
>
  <button
    (click)="handleCollapse()"
    class="absolute top-10 -right-3 flex cursor-pointer rounded-md border border-zinc-700 bg-zinc-900 p-1"
  >
    <ng-icon
      name="remixArrowLeftSLine"
      [class]="'duration-500 ' + (isCollapsed() ? '' : 'rotate-180')"
    />
  </button>
  <div
    [class]="
      'hover:shadow-accent hover:bg-accent flex w-full cursor-pointer items-center gap-4 rounded-full p-1 duration-500 hover:shadow-2xl ' +
      (!isCollapsed() && 'pr-3')
    "
  >
    <div
      class="bg-red aspect-square w-12 overflow-hidden rounded-full"
    >
      <img src="profile_pic.jpg" alt="" />
    </div>
    @if (!isCollapsed()) {
      <p class="font-semibold">Nagy Levente</p>
    }
  </div>
  @if (!isCollapsed()) {
    <ng-container *ngTemplateOutlet="divider" />
  }
  <div
    [class]="
      'flex flex-col gap-2 ' + (isCollapsed() && 'items-center')
    "
  >
    <p class="text-[10px] font-semibold text-zinc-400">MAIN</p>
    <app-button
      icon="remixHome2Line"
      label="Dashboard"
      route="/home"
      variant="text"
      [tooltip]="isCollapsed() ? 'Dashboard' : undefined"
      tooltipPosition="right"
    />
    <app-button
      icon="remixCalendarTodoFill"
      label="Todo"
      route="/todo"
      variant="text"
      [tooltip]="isCollapsed() ? 'Todo' : undefined"
      tooltipPosition="right"
    />
    <p-tree [value]="projects" selectionMode="single">
      <ng-template pTemplate="default" let-node>
        <div class="flex items-center gap-2">
          @if (node.data?.icon) {
            <ng-icon [name]="node.data.icon" />
          }
          <span>{{ node.label }}</span>
        </div>
      </ng-template>
    </p-tree>
    <app-button
      icon="remixFileList2Line"
      label="Playground"
      route="/playground"
      variant="text"
      [tooltip]="isCollapsed() ? 'Playground' : undefined"
      tooltipPosition="right"
    />
  </div>
  @if (!isCollapsed()) {
    <ng-container *ngTemplateOutlet="divider" />
  }
  <div
    [class]="
      'flex flex-col gap-2 ' + (isCollapsed() && 'items-center')
    "
  >
    <p class="text-[10px] font-semibold text-zinc-400">SETTINGS</p>
    <app-button
      icon="remixSettings4Line"
      label="Settings"
      variant="text"
      [tooltip]="isCollapsed() ? 'Settings' : undefined"
      tooltipPosition="right"
    />
  </div>
</div>

<ng-template #divider>
  <span class="h-px w-full bg-zinc-700"></span>
</ng-template>
