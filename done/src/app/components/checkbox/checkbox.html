<div
  (click)="handleClick()"
  [class.rounded-full]="!square()"
  [class.rounded-md]="square()"
  class="border border-zinc-400 w-5 h-5 rounded-full flex items-center justify-center cursor-pointer relative duration-500 hover:shadow-[0_0_8px_var(--color-accent)]"
>
  @if (checked()) {
    <ng-icon name="remixCheckLine" size="24" class="absolute" />
  }
</div>
