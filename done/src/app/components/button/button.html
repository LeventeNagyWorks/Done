<p-button
  [label]="label()"
  [rounded]="rounded()"
  [variant]="variant()"
  [routerLink]="route()"
  [size]="size()"
  [severity]="severity()"
  [fluid]="fluid()"
  [styleClass]="styleClass()"
>
  <ng-template pTemplate="icon">
    @if (icon()) {
      <ng-icon [name]="icon()!" />
    }
  </ng-template>
</p-button>
