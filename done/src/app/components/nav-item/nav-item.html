<div class="flex">
  @if (!isCollapsed()) {
    <img
      [src]="isLast() ? 'edge-last.svg' : 'edge.svg'"
      alt=""
      class="w-8"
    />
  }
  <button
    [pTooltip]="isCollapsed() ? label() : undefined"
    tooltipPosition="right"
    [class]="
      'flex w-full cursor-pointer items-center rounded-xl duration-500 hover:bg-zinc-600 ' +
      (isCollapsed() ? 'justify-center p-1' : 'gap-2 p-3 py-1')
    "
  >
    <span>{{ emoji() }}</span>
    @if (!isCollapsed()) {
      {{ label() }}
    }
  </button>
</div>
