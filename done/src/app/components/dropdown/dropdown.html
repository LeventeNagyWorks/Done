<div class="relative">
  <div
    (click)="handleOpen()"
    [class]="'relative flex justify-between items-center gap-2 cursor-pointer max-w-3xs select-none px-4 py-2 bg-zinc-700 rounded-xl border border-transparent hover:border-accent hover:ring-3 ring-accent/30 focus-within:ring-2 focus-within:ring-accent duration-500'"
  >
    <span>Buttons</span>
    <ng-icon
      name="remixArrowDownSLine"
      [class]="'text-xl duration-500 ' + (opened() && 'rotate-180')"
    />
  </div>
  @if (opened()) {
    <div
      [class]="'absolute z-10 mt-3 flex flex-col gap-2 max-w-xs bg-zinc-700 p-2 border border-accent rounded-xl w-full'"
    >
      @for (option of options(); track option.label) {
        <span
          class="cursor-pointer hover:bg-zinc-500 duration-500 px-4 p-2 rounded-lg"
          (click)="option.onClick()"
        >
          {{ option.label }}
        </span>
      }
    </div>
  }
</div>
