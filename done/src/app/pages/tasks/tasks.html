<div class="flex flex-1 flex-col gap-4">
  <div class="w-full rounded-2xl bg-black/80 p-3 px-6">
    <div class="flex items-center gap-3">
      <span class="cursor-pointer pb-1 text-xl select-none">💵</span>
      <h1 class="text-xl font-semibold">Finance</h1>
    </div>
  </div>
  <div class="flex flex-1 gap-6">
    <app-document-menu />
    <app-container>
      <div class="flex flex-col gap-0.5 p-4">
        <app-toolbar />
        @for (
          node of lineService.nodes();
          track node.id;
          let i = $index
        ) {
          <app-line-node
            [node]="node"
            [num]="getOrderedNum(lineService.nodes(), i)"
          />
        }
      </div>
    </app-container>
  </div>
</div>
