<app-container>
  <div class="flex flex-col gap-0.5 p-4">
    <app-toolbar />
    @for (
      node of lineService.nodes();
      track node.id;
      let i = $index
    ) {
      <app-line-node
        [node]="node"
        [num]="getOrderedNum(lineService.nodes(), i)"
      />
    }
  </div>
</app-container>
