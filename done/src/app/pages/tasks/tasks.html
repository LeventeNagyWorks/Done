<div class="flex flex-1 flex-col gap-4">
  <div class="w-full rounded-2xl bg-black/80 p-3 px-6">
    <div class="flex items-center gap-3">
      <span class="cursor-pointer pb-1 text-xl select-none">💵</span>
      <h1 class="text-xl font-semibold">Finance</h1>
    </div>
  </div>
  <div class="flex flex-1 gap-6">
    <app-document-menu />
    <app-container>
      <div class="flex flex-col gap-0.5">
        <div class="flex flex-col gap-3">
          <div class="flex items-center gap-4">
            <div class="flex gap-2">
              <span class="cursor-pointer select-none">🗓️</span>
              <span>Todo</span>
            </div>
            <app-button
              class="flex h-8 w-8 items-center justify-center"
              icon="remixFullscreenLine"
              [iconOnly]="true"
            />
          </div>
          <app-toolbar />
        </div>
        @for (
          node of lineService.nodes();
          track node.id;
          let i = $index
        ) {
          <app-line-node
            [node]="node"
            [num]="getOrderedNum(lineService.nodes(), i)"
          />
        }
      </div>
    </app-container>
  </div>
</div>
