<div class="flex flex-1 flex-col gap-4">
  <div class="w-full rounded-2xl bg-black/80 p-3 px-6">
    <div class="flex items-center gap-3">
      <app-emoji-picker [(emoji)]="pageEmoji" class="pb-1 text-xl" />
      <h1 class="text-xl font-semibold">Finance</h1>
    </div>
  </div>
  <div class="flex flex-1 gap-6">
    <app-document-menu />
    <app-container>
      <div class="flex flex-col gap-0.5">
        <div class="flex flex-col gap-3">
          <div class="flex items-center justify-between gap-4">
            <div class="flex gap-2">
              <app-emoji-picker [(emoji)]="sectionEmoji" />
              <span>Todo</span>
            </div>
            <app-button
              class="rounded-md bg-transparent! duration-500 hover:bg-zinc-600!"
              btnSize="small"
              icon="remixFullscreenLine"
              tooltip="Enter Fullscreen Mode"
              tooltipPosition="bottom"
            />
          </div>
          <app-toolbar />
        </div>
        <app-texteditor />
      </div>
    </app-container>
  </div>
</div>
