<app-container>
  <app-dropdown
    [options]="playgroundOptions"
    [(selected)]="selectedPlayground"
    [defaultOption]="playgroundOptions[0]"
  />
  @switch (selectedPlayground()?.label) {
    @case ('Button') {
      <app-button
        label="Mail"
        [rounded]="true"
        [variant]="'text'"
        [icon]="'remixPencilLine'"
      />
      <app-button
        label="Mail"
        [rounded]="true"
        [variant]="'outlined'"
        [icon]="'remixPencilLine'"
      />
      <app-button [rounded]="true" [icon]="'remixPencilLine'" />
      <app-button label="Mail" [rounded]="true" [variant]="'text'" />
      <app-button
        label="Mail"
        icon="remixMailAddLine"
        [size]="'large'"
      />
      <app-button label="Mail" icon="remixMailAddLine" />
      <app-button
        label="Mail"
        icon="remixMailAddLine"
        [size]="'small'"
      />
    }
    @case ('Checkbox') {
      <app-checkbox type="list" />
      <app-checkbox />
      <app-checkbox type="square" />
      <app-checkbox label="Accept the Terms" />
      <app-checkbox type="square" label="Accept the Terms" />
    }
    @case ('Dropdown') {
      <app-dropdown
        label="Searchable Label"
        [options]="testOptions"
        [(selected)]="selectedTest"
        [searchable]="true"
      />
      <app-dropdown
        [options]="testOptions"
        [(selected)]="selectedTest"
        [searchable]="true"
        placeholder="Searchable"
      />
      <app-dropdown
        label="Test Label"
        [options]="testOptions"
        [(selected)]="selectedTest"
        placeholder="Placeholder"
      />
      <app-dropdown
        [options]="testOptions"
        [(selected)]="selectedTest"
      />
    }
    @case ('Input') {
      <!-- <app-input label="Name" [required]="true" />
      <app-input
        type="email"
        label="Email"
        [required]="true"
        placeholder="Email"
      />
      <app-input type="password" label="Password" [required]="true" />
      <app-input
        type="textarea"
        label="Description"
        placeholder="Description"
      /> -->
    }
    @case ('Label') {
      <app-label label="Label" />
    }
    @case ('SideMenu') {
      <app-side-menu />
    }
  }
</app-container>
